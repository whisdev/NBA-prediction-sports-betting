<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="NBA betting pipeline">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="920" height="280" rx="16" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Tonight&apos;s Edge  How a pick gets made</text>

  <!-- Step boxes -->
  <g filter="url(#shadow)">
    <rect x="24" y="70" width="150" height="72" rx="10" fill="#334155"/>
    <rect x="194" y="70" width="150" height="72" rx="10" fill="#334155"/>
    <rect x="364" y="70" width="150" height="72" rx="10" fill="#334155"/>
    <rect x="534" y="70" width="150" height="72" rx="10" fill="#334155"/>
    <rect x="704" y="70" width="192" height="72" rx="10" fill="url(#accent)"/>
  </g>

  <text x="99" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Slate + Odds</text>
  <text x="99" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">SBR / FanDuel DK</text>

  <text x="269" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Team Stats</text>
  <text x="269" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Rest, pace, form</text>

  <text x="439" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Features</text>
  <text x="439" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Matchup matrix</text>

  <text x="609" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">XGBoost</text>
  <text x="609" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">ML + O/U ONNX</text>

  <text x="800" y="100" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">+EV / Kelly</text>
  <text x="800" y="120" text-anchor="middle" fill="#ffedd5" font-family="system-ui,sans-serif" font-size="11">Your bet sheet</text>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M174 106 L194 106"/>
    <path d="M344 106 L364 106"/>
    <path d="M514 106 L534 106"/>
    <path d="M684 106 L704 106"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Bottom legend -->
  <rect x="24" y="180" width="872" height="76" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="44" y="208" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Moneyline ~69% val acc</text>
  <text x="44" y="228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Side + confidence % vs book price</text>
  <text x="320" y="208" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Totals model</text>
  <text x="320" y="228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">OVER / UNDER on posted line</text>
  <text x="580" y="208" fill="#4ade80" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Green EV = edge</text>
  <text x="580" y="228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Compare model win% to American odds</text>
</svg>
